<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Eli Doggart — Mechanical Engineer. Portfolio being updated.">
  <meta name="color-scheme" content="light dark">
  <title>Eli Doggart — Mechanical Engineer</title>
  <style>
    :root { color-scheme: light dark; --paper:#f6f5f1; --ink:#252823; --quiet:#5b6259; --line:#cbd0c7; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:18px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100% - 48px, 680px); margin:clamp(90px,18vh,210px) auto 64px; }
    h1 { margin:0; font:500 clamp(44px,8vw,68px)/1.12 Georgia,"Times New Roman",serif; letter-spacing:-.025em; }
    .role { margin:18px 0 0; color:var(--quiet); }
    .status { margin:64px 0 0; padding-top:28px; border-top:1px solid var(--line); }
    a { color:inherit; text-underline-offset:5px; text-decoration-thickness:1px; }
    a:hover { text-decoration-thickness:2px; }
    a:focus-visible { outline:2px solid currentColor; outline-offset:6px; }
    @media(prefers-color-scheme:dark) { :root { --paper:#20231f; --ink:#f0f0e9; --quiet:#c0c6ba; --line:#495045; } }
  </style>
</head>
<body>
  <main>
    <h1>Eli Doggart</h1>
    <p class="role">Mechanical Engineer</p>
    <p class="status">Portfolio being updated.</p>
    <p><a href="mailto:elidoggart@gmail.com">elidoggart@gmail.com</a></p>
  </main>
</body>
</html>
