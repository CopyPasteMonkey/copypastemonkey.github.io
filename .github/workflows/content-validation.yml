name: Validate portfolio content
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Superseded PR revisions do not need to finish testing. Deployment is separate.
concurrency:
  group: content-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - run: npm run test:browser
        env:
          TEST_BROWSER: webkit
      - name: Keep failed UI test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-failures
          path: |
            test-results/
            .local/parity-*.png
          if-no-files-found: ignore
          retention-days: 7
      # Validation only; the separately configured Pages workflow deploys main.
